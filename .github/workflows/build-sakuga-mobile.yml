
name: Build Sakuga Mobile APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      # 1. 获取 Sakuga Mobile 的 Android 分支
      - name: Checkout Sakuga Mobile
        uses: actions/checkout@v4
        with:
          repository: Bryancm/sakuga_mobile
          ref: android
          persist-credentials: false

      # 2. Node.js 16，兼容 React Native 0.64.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'

      # 3. JDK 17，用于安装 Android SDK
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 4. 初始化 Android SDK
      # 避免安装已经失效的 tools 包
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # 5. 安装 Android 30 和旧版 NDK
      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platforms;android-30" \
            "build-tools;29.0.3" \
            "ndk;20.1.5948944"

      # 6. 切换 JDK 11，兼容 Gradle 6.7
      - name: Setup Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      # 7. 安装 Yarn 和 JavaScript 依赖
      - name: Install JavaScript dependencies
        run: |
          npm install --global yarn@1.22.22
          yarn install --network-timeout 600000

      # 8. 修复旧版 Android 依赖仓库
      - name: Fix legacy Maven repositories
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/build.gradle")
          content = path.read_text()

          # Maven Central 优先于 JCenter
          content = content.replace(
              "        jcenter()",
              "        mavenCentral()\n        jcenter()"
          )

          # 为旧版视频依赖添加候选仓库
          marker = "        maven { url 'https://www.jitpack.io' }"

          extra = """
                  maven {
                      url "https://repository.mulesoft.org/nexus/content/repositories/public/"
                  }
                  maven {
                      url "https://maven.wso2.org/nexus/content/repositories/public/"
                  }
          """

          if marker in content:
              content = content.replace(
                  marker,
                  extra + marker
              )
          else:
              raise RuntimeError(
                  "Cannot find JitPack repository marker"
              )

          path.write_text(content)

          print("Updated Android Maven repositories:")
          print(content)
          PY

      # 9. 把 JavaScript 打包到 Debug APK
      # 安装后不需要连接 Metro 开发服务器
      - name: Enable JavaScript bundling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          content = path.read_text()

          # 只修改实际配置，避免修改注释中的示例
          old = """project.ext.react = [
              enableHermes: true,"""

          new = """project.ext.react = [
              bundleInDebug: true,
              enableHermes: true,"""

          if old not in content:
              raise RuntimeError(
                  "Cannot locate React Native configuration"
              )

          content = content.replace(old, new, 1)
          path.write_text(content)

          print("Enabled JavaScript bundling")
          PY

      # 10. 检查构建环境
      - name: Check build environment
        working-directory: android
        run: |
          node --version
          java -version
          chmod +x gradlew
          ./gradlew --version

      # 11. 编译 Sakuga Mobile APK
      - name: Build Sakuga Mobile APK
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies

      # 12. 验证 APK 是否生成
      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/

      # 13. 上传 APK
      - name: Upload Sakuga Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: Sakuga-Mobile-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
