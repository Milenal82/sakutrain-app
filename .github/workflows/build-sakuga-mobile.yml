
name: Build Sakuga Mobile APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      # 1. 获取 Sakuga Mobile Android 分支源码
      - name: Checkout Sakuga Mobile
        uses: actions/checkout@v4
        with:
          repository: Bryancm/sakuga_mobile
          ref: android
          persist-credentials: false

      # 2. 安装 Node.js 16
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'

      # 3. 安装 JDK 17
      # 新版 Android SDK 工具需要 JDK 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 4. 配置 Android SDK
      # 避免安装已经失效的 tools 包
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # 5. 安装 Android SDK 组件
      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platforms;android-30" \
            "build-tools;29.0.3" \
            "ndk;20.1.5948944"

      # 6. 切换到 JDK 11
      # 兼容旧版 Gradle 6.7
      - name: Setup Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      # 7. 安装 Yarn 和项目依赖
      - name: Install JavaScript dependencies
        run: |
          npm install --global yarn@1.22.22
          yarn install --network-timeout 600000

      # 8. 在 Debug APK 中打包 JavaScript
      - name: Enable JavaScript bundling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          content = path.read_text()

          old = "project.ext.react = ["
          new = "project.ext.react = [\n        bundleInDebug: true,"

          if old not in content:
              raise RuntimeError("Cannot find project.ext.react")

          content = content.replace(old, new, 1)
          path.write_text(content)
          PY

      # 9. 检查 Java 和 Gradle
      - name: Check build environment
        working-directory: android
        run: |
          java -version
          chmod +x gradlew
          ./gradlew --version

      # 10. 编译 APK
      - name: Build Sakuga Mobile APK
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # 11. 上传构建结果
      - name: Upload Sakuga Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: Sakuga-Mobile-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
